name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"   # daily
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - scripts/generate_stats.py

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile stats cards"
          git push
